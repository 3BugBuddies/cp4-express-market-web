<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produtoId} != null ? 'Editar produto' : 'Novo produto'">Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="topbar">
        <h1>Express Market</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary">Sair</button>
        </form>
    </header>

    <main class="container">
        <div class="panel" style="max-width: 480px; margin: 0 auto;">
            <div class="panel-header">
                <h2 th:text="${produtoId} != null ? 'Editar produto' : 'Novo produto'">Produto</h2>
            </div>

            <form th:object="${produtoRequest}"
                  th:action="${produtoId} != null ? @{/market/editar/{id}(id=${produtoId})} : @{/market/novo}"
                  method="post">

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}">
                    <p class="error-text" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
                </div>

                <div class="field">
                    <label for="tipo">Tipo</label>
                    <input type="text" id="tipo" th:field="*{tipo}">
                    <p class="error-text" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></p>
                </div>

                <div class="field">
                    <label for="setor">Setor</label>
                    <input type="text" id="setor" th:field="*{setor}">
                    <p class="error-text" th:if="${#fields.hasErrors('setor')}" th:errors="*{setor}"></p>
                </div>

                <div class="field">
                    <label for="tamanho">Tamanho</label>
                    <input type="text" id="tamanho" th:field="*{tamanho}">
                    <p class="error-text" th:if="${#fields.hasErrors('tamanho')}" th:errors="*{tamanho}"></p>
                </div>

                <div class="field">
                    <label for="preco">Preço</label>
                    <input type="number" step="0.01" id="preco" th:field="*{preco}">
                    <p class="error-text" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></p>
                </div>

                <div class="actions" style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/market}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
